name: Security CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Build, scan and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install application, helper and CI dependencies
        run: |
          python -m pip install --upgrade "pip>=26.2"
          python -m pip install -r requirements-dev.txt -r requirements-ci.txt
          python -m pip check

      - name: Prepare evidence directory
        run: mkdir -p artifacts/experiments

      - name: Run Bandit
        run: >-
          python -m bandit -r services packages
          -x '*/build/*,*/dist/*' -ll -f json -o artifacts/bandit.json

      - name: Run pip-audit
        run: >-
          python -m pip_audit
          --format json --output artifacts/pip-audit.json
          --cache-dir artifacts/pip-audit-cache

      - name: Run complete test suite
        run: >-
          python -m pytest -q -p no:cacheprovider
          --junitxml=artifacts/junit.xml

      - name: Run four vulnerable/fixed experiment demonstrations
        run: python -m experiments.run > artifacts/experiments/phase3-results.txt

      - name: Archive test and security evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-ci-evidence-${{ github.run_id }}
          path: |
            artifacts/bandit.json
            artifacts/pip-audit.json
            artifacts/junit.xml
            artifacts/experiments/phase3-results.txt
          if-no-files-found: warn
          retention-days: 30
